name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test JavaScript calculation model
        run: node --test tests/calculator.test.cjs
      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build offline Windows program
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name LeverageCalculator
          --add-data "web;web"
          --collect-all webview
          --hidden-import webview.platforms.edgechromium
          desktop/main.py
      - name: Publish downloadable executable
        uses: actions/upload-artifact@v4
        with:
          name: LeverageCalculator-Windows
          path: dist/LeverageCalculator.exe
          if-no-files-found: error
          retention-days: 30
